name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: false
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11 --prefix "$RUNNER_TEMP/npm"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - run: pnpm verify
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
